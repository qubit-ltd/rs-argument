[package]
name = "qubit-argument"
version = "0.4.4"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-argument"
description = "Structured, ownership-preserving argument validation for Rust applications"
homepage = "https://github.com/qubit-ltd/rs-argument"
documentation = "https://docs.rs/qubit-argument"
readme = "README.md"
keywords = ["argument", "validation", "utility", "qubit"]
categories = ["development-tools", "rust-patterns"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
    "/fuzz/**",
    "/benches/**",
]

[lib]
name = "qubit_argument"
doctest = true
test = true

[features]
default = []
regex = ["dep:regex"]

[dependencies]
regex = { version = "1.13", optional = true }
